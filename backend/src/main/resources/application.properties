spring.application.name=sistema-monitoreo-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/monitoreo_cultivo?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# WebSocket
spring.websocket.allowed-origins=http://localhost:8081,http://127.0.0.1:8081
