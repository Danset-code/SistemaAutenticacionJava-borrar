spring.application.name=sistema-monitoreo-backend

# Puerto
server.port=${PORT:8080}

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:monitoreo}?sslMode=REQUIRED
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate puede detectar MySQL automáticamente
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JSON
# =========================
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================
# WebSocket
# =========================
spring.websocket.allowed-origins=${FRONTEND_URL:http://localhost:8081}
